# Stackryze API token (write scope). Base64 is handled by `stringData`.
apiVersion: v1
kind: Secret
metadata:
  name: stackryze-api-token
  namespace: cert-manager
type: Opaque
stringData:
  token: "sk_dns_REPLACE_ME"
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-stackryze
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: you@example.com
    privateKeySecretRef:
      name: letsencrypt-stackryze-account
    solvers:
      - dns01:
          webhook:
            groupName: acme.stackryze.com
            solverName: stackryze
            config:
              apiUrl: https://api-dns.stackryze.com/api
              apiTokenSecretRef:
                name: stackryze-api-token
                key: token
---
# Example wildcard certificate issued via DNS-01 on Stackryze.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: example-com-wildcard
  namespace: default
spec:
  secretName: example-com-wildcard-tls
  issuerRef:
    name: letsencrypt-stackryze
    kind: ClusterIssuer
  commonName: "*.example.com"
  dnsNames:
    - "example.com"
    - "*.example.com"
